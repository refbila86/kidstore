<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<div style="padding: 0.5rem;">
		<div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
			<div style="width: 48px; height: 48px; background: linear-gradient(135deg, #1e3a8a, #2563eb); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white;">
				<i class="pi pi-database" style="font-size: 1.4rem;"></i>
			</div>
			<div>
				<h2 style="margin: 0; font-size: 1.3rem;">Cópias de Segurança</h2>
				<p style="color: #64748b; font-size: 0.85rem; margin: 0;">Backups MySQL - Pasta: #{backupBean.backupDir}</p>
			</div>
		</div>

		<div style="background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem;">
			<i class="pi pi-folder" style="color: #1e3a8a;"></i> 
			<span style="font-size: 0.8rem; color: #334155;"><b>Pasta:</b> #{backupBean.backupDir} - automático todo dia às 22h (Africa/Maputo)</span>
		</div>

		<p:messages id="msgs" showDetail="true" closable="true" />

		<div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
			<p:commandButton value="Gerar Backup Agora" icon="pi pi-cloud-upload"
				actionListener="#{backupBean.gerarBackup}" update="@form"
				style="background:#1e3a8a; border:0; padding:0.9rem 1.2rem; border-radius:12px; font-weight:600;" />
			<p:commandButton value="Atualizar" icon="pi pi-refresh" styleClass="ui-button-secondary"
				actionListener="#{backupBean.listarBackups}" update="@form" style="border-radius:12px; padding:0.9rem 1.2rem;" />
		</div>

		<p:dataTable id="backupTable" value="#{backupBean.backups}" var="b"
			emptyMessage="Nenhum backup encontrado" 
			paginator="true" rows="10" 
			rowsPerPageTemplate="5,10,20,50"
			paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
			currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}"
			paginatorPosition="bottom"
			styleClass="p-datatable-striped">

			<p:column headerText="Nome" sortBy="#{b.nome}" filterBy="#{b.nome}" filterMatchMode="contains">
				<i class="pi pi-file" style="margin-right: 0.4rem;"></i>#{b.nome}
			</p:column>

			<p:column headerText="Data" width="170" sortBy="#{b.data}">
				<h:outputText value="#{b.data}">
					<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
				</h:outputText>
			</p:column>

			<p:column headerText="Tamanho" width="100" sortBy="#{b.tamanho}">#{b.tamanho}</p:column>

			<p:column headerText="Ações" width="140">
				<p:commandButton icon="pi pi-download" title="Baixar" ajax="false" styleClass="ui-button-rounded">
					<p:fileDownload value="#{backupBean.downloadFile(b)}" />
				</p:commandButton>
				<p:commandButton icon="pi pi-trash" title="Apagar" styleClass="ui-button-rounded ui-button-danger"
					style="margin-left:0.4rem;" actionListener="#{backupBean.deletar(b)}" update="@form">
					<p:confirm header="Apagar?" message="Remover #{b.nome}?" icon="pi pi-exclamation-triangle" />
				</p:commandButton>
			</p:column>
		</p:dataTable>

		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade" width="350">
			<p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check" />
			<p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-secondary" icon="pi pi-times" />
		</p:confirmDialog>
	</div>
</ui:composition>
