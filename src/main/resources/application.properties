##############################################
# APLICAÇÃO
##############################################

spring.application.name=sales_management

##############################################
# SERVIDOR
##############################################

server.port=8085

server.error.whitelabel.enabled=false

##############################################
# BASE DE DADOS MYSQL
##############################################

spring.datasource.url=jdbc:mysql://localhost:3306/sales_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Maputo

spring.datasource.username=root
spring.datasource.password=Utrafe2004@Mysql#2026

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

##############################################
# JSF + PRIMEFACES
##############################################

spring.main.web-application-type=servlet

# spring.mvc.view.prefix=/pages/
# spring.mvc.view.suffix=.xhtml

##############################################
# JOINFACES / JSF
##############################################
joinfaces.jsf.project-stage=Production
joinfaces.jsf.facelets-refresh-period=-1
joinfaces.jsf.default-suffix=.xhtml
joinfaces.jsf.enabled=true

##############################################
# SPRING
##############################################

spring.main.allow-bean-definition-overriding=true

##############################################
# PRIMEFACES
##############################################

joinfaces.primefaces.theme=saga
joinfaces.primefaces.font-awesome=true

##############################################
# LOCALE
##############################################

spring.web.locale=pt_MZ
spring.web.locale-resolver=fixed