##############################################
# CONFIGURAÇÃO DO SERVIDOR
##############################################
server.port=8085
#server.servlet.context-path=/users
server.error.whitelabel.enabled=false

##############################################
# CONFIGURAÇÃO DA BASE DE DADOS (MySQL)
##############################################
spring.application.name=sales_management
spring.datasource.url=jdbc:mysql://localhost:3306/sales_management?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Utrafe2004@Mysql#2026

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações JSF + PrimeFaces
spring.main.web-application-type=servlet
spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.xhtml

##############################################
# CONFIGURAÇÃO DO JOINFACES / JSF
##############################################
# Ativa o JSF (mojarra embutido)
joinfaces.jsf.project-stage=Development
joinfaces.jsf.facelets-refresh-period=1
joinfaces.jsf.default-suffix=.xhtml
joinfaces.jsf.enabled=true

# Habilita suporte Spring para JSF
spring.main.allow-bean-definition-overriding=true

# Define o tema e outras opções do PrimeFaces
joinfaces.primefaces.theme=saga
joinfaces.primefaces.font-awesome=true

##############################################
# LOCAIS PADRÃO
##############################################
debug=true

spring.web.locale=pt_MZ
spring.web.locale-resolver=fixed