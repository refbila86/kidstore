<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

 <style>
:root {
    --primary: #2563eb;      /* Azul principal */
    --primary-dark: #1e3a8a; /* Azul mais forte */
    --danger: #ef4444;
    --warning: #f59e0b;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-600: #4b5563;
    --gray-900: #111827;
}

.client-page {
    animation: fadeIn 0.5s ease-out;
}

/* Page Header */
.page-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 2rem;
    color: white;
    box-shadow: 0 10px 40px rgba(37, 99, 235, 0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
}

.page-header h1 {
    font-size: 2rem;
    font-weight: 800;
    margin: 0;
}

/* Botão de cadastro */
.btn-new-client {
    background: white !important;
    color: var(--primary) !important;
    border-radius: 12px !important;
    padding: 0.75rem 1.5rem !important;
    font-weight: 700 !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
    transition: all 0.3s ease;
}

.btn-new-client:hover {
    background: #f3f4f6 !important;
    transform: translateY(-2px);
}

/* DataTable */
.table-container {
    background: white;
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    border: 1px solid var(--gray-200);
}

.ui-datatable thead th {
    background: var(--gray-50) !important;
    color: var(--gray-900) !important;
    font-weight: 700;
    padding: 1rem !important;
    border-bottom: 2px solid var(--gray-200);
    text-transform: uppercase;
    font-size: 0.75rem;
}

.ui-datatable tbody td {
    padding: 1rem !important;
    border-bottom: 1px solid var(--gray-100);
    vertical-align: middle;
    font-size: 0.9rem;
}

.ui-datatable tbody tr:hover {
    background: var(--gray-50);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

/* Botões de ação */
.action-btn {
    width: 38px !important;
    height: 38px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 10px !important;
    border: none !important;
    transition: all 0.3s ease;
}

/* EDITAR = Azul */
.action-btn.btn-edit {
    background: var(--primary);
    color: white;
}

.action-btn.btn-edit:hover {
    background: var(--primary-dark);
}

/* DELETAR */
.action-btn.btn-delete {
    background: var(--danger);
    color: white;
}

.action-btn.btn-delete:hover {
    background: #dc2626;
}

/* Animação FadeIn */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
 

	<h:form id="formUser" class="client-page">

		<!-- Header -->
		<div class="page-header">
			<h1>👥 Clientes</h1>
			<p:commandButton value="Incluir Cliente" icon="pi pi-plus"
				styleClass="btn-new-client"
				actionListener="#{dashboardBean.loadCustomerInclude}"
				update=":mainForm:mainContent" process="@this" />
		</div>

		<!-- Table -->
		<div class="table-container">
			<p:dataTable id="tabela" value="#{customerBean.listCustomer}"
				var="customer" paginator="true" rows="10" responsiveLayout="scroll"
				rowPerPageTemplate="10,15,20,25"
				styleClass="p-datatable-striped p-datatable-sm"
				emptyMessage="Nenhum cliente encontrado">

				<p:column headerText="ID" style="width:5%" sortBy="#{customer.id}">
					<h:outputText value="#{customer.id}" />
				</p:column>

				<p:column headerText="Nome" style="width:30%"
					filterBy="#{customer.name}" sortBy="#{customer.name}"
					filterMatchMode="contains" filterPlaceholder="Pesquisar..."
					sortable="true">
					<h:outputText value="#{customer.name}" />
				</p:column>

				<p:column headerText="Contacto" style="width:15%"
					filterBy="#{customer.cellphone}" sortBy="#{customer.cellphone}"
					filterMatchMode="contains" filterPlaceholder="Pesquisar..."
					sortable="true">
					<h:outputText value="#{customer.cellphone}" />
				</p:column>

				<p:column headerText="Endereço" style="width:30%"
					filterBy="#{customer.address}" filterMatchMode="contains"
					filterPlaceholder="Pesquisar...">
					<h:outputText value="#{customer.address}" />
				</p:column>

				<p:column headerText="Ações" style="width:20%; text-align:center;">

					<p:commandButton icon="pi pi-pencil" title="Editar"
						styleClass="action-btn btn-edit"
						actionListener="#{customerBean.editCustomer(customer)}"
						update=":mainForm:mainContent" process="@this" />

					<p:commandButton icon="pi pi-trash" title="Remover"
						styleClass="action-btn btn-delete"
						actionListener="#{customerBean.remover(customer.id)}"
						update="tabela">
						<p:confirm header="Confirmação"
							message="Deseja realmente excluir este cliente?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>

			</p:dataTable>
		</div>

	</h:form>
</ui:composition>
