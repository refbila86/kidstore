<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

	<h:form id="formProductEdit" styleClass="product-container p-fluid">

		<style>
.product-container {
	max-width: 1100px;
	margin: 0 auto;
	padding: 2rem 1rem;
	animation: fadeIn 0.5s ease-out;
}

.product-header {
	background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
	border-radius: 20px;
	padding: 2rem;
	margin-bottom: 2rem;
	box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25);
	color: white;
}

.header-content {
	display: flex;
	align-items: center;
	gap: 1rem;
}

.header-icon {
	font-size: 2.8rem;
}

.header-text h1 {
	margin: 0;
	font-size: 1.8rem;
	font-weight: 700;
}

.header-text p {
	margin: 0.5rem 0 0;
	font-size: 1rem;
	opacity: 0.95;
}

.product-card {
	background: white;
	border-radius: 20px;
	padding: 2rem;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
	border: 1px solid #dbeafe;
}

.section-title {
	display: flex;
	align-items: center;
	gap: 0.75rem;
	font-size: 1.25rem;
	font-weight: 700;
	color: #1e3a8a;
	margin: 0 0 1.5rem;
	padding-bottom: 0.75rem;
	border-bottom: 2px solid #dbeafe;
}

.section-title:not(:first-child) {
	margin-top: 2rem;
}

.info-grid {
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	gap: 1.25rem;
}

.info-grid.three-columns {
	grid-template-columns: repeat(3, minmax(0, 1fr));
}

.info-item {
	display: flex;
	flex-direction: column;
	gap: 0.5rem;
}

.info-item.full-width {
	grid-column: 1/-1;
}

.info-label {
	font-weight: 600;
	color: #1e40af;
	font-size: 0.95rem;
}

.required {
	color: #dc2626;
}

.product-container .ui-inputfield, .product-container .ui-selectonemenu
	{
	width: 100%;
	border-radius: 12px !important;
	border: 2px solid #dbeafe !important;
	transition: all 0.3s ease !important;
}

.product-container .ui-inputfield:focus, .product-container .ui-selectonemenu.ui-state-focus
	{
	border-color: #2563eb !important;
	box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10) !important;
}

.form-divider {
	margin: 2rem 0;
	border: 0;
	border-top: 1px solid #dbeafe;
}

.button-group {
	display: flex;
	justify-content: space-between;
	gap: 1rem;
	margin-top: 1.5rem;
}

.btn-cancel {
	border-radius: 12px !important;
	padding: 0.8rem 2rem !important;
	background: #f8fafc !important;
	border: 2px solid #cbd5e1 !important;
	color: #475569 !important;
}

.btn-next {
	border-radius: 12px !important;
	padding: 0.8rem 2rem !important;
	font-weight: 700 !important;
	background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
	border: none !important;
	color: white !important;
}

.btn-next:hover {
	box-shadow: 0 8px 20px rgba(37, 99, 235, 0.30) !important;
	transform: translateY(-1px);
}

@
keyframes fadeIn {from { opacity:0;
	transform: translateY(20px);
}

to {
	opacity: 1;
	transform: translateY(0);
}

}
@media ( max-width : 768px) {
	.product-container {
		padding: 1rem 0.5rem;
	}
	.product-header, .product-card {
		padding: 1.5rem;
	}
	.info-grid, .info-grid.three-columns {
		grid-template-columns: 1fr;
	}
	.button-group {
		flex-direction: column;
	}
	.button-group .ui-button {
		width: 100%;
	}
}
</style>

		<p:messages id="msgs" showDetail="true" closable="true" />

		<!-- Cabeçalho -->
		<div class="product-header">
			<div class="header-content">
				<div class="header-icon">
					<i class="pi pi-box"></i>
				</div>

				<div class="header-text">
					<h1>Inclusão de Produto</h1>
					<p>Preencha os dados abaixo para cadastrar um novo produto.</p>
				</div>
			</div>
		</div>

		<!-- Formulário -->
		<div class="product-card">

			<!-- Dados Gerais -->
			<h3 class="section-title">
				<i class="pi pi-info-circle"></i> Dados Gerais
			</h3>

			<div class="info-grid">
				<div class="info-item">
					<h:outputLabel value="Nome do Produto" styleClass="info-label" />
					<p:inputText id="name" value="#{productBean.product.name}"
						required="true" requiredMessage="O nome do produto é obrigatório."
						placeholder="Digite o nome do produto" />
				</div>

				<div class="info-item">
					<h:outputLabel value="Marca / Fabricante" styleClass="info-label" />
					<p:inputText id="manufacturer"
						value="#{productBean.product.manufacturer}" required="true"
						requiredMessage="A marca ou fabricante é obrigatório."
						placeholder="Digite a marca ou fabricante" />
				</div>

				<div class="info-item">
					<h:outputLabel value="Categoria" styleClass="info-label" />
					<p:selectOneMenu id="category"
						value="#{productBean.product.category}"
						converter="omnifaces.SelectItemsConverter" required="true"
						requiredMessage="Selecione uma categoria." filter="true"
						filterMatchMode="contains">

						<f:selectItem itemLabel="Selecione a categoria..."
							itemValue="#{null}" noSelectionOption="true" />

						<f:selectItems value="#{productBean.listCategory}" var="cat"
							itemLabel="#{cat.name}" itemValue="#{cat}" />
					</p:selectOneMenu>
				</div>

				<div class="info-item">
					<h:outputLabel value="Fornecedor" styleClass="info-label" />
					<p:selectOneMenu id="supplier"
						value="#{productBean.selectedSupplierId}" filter="true"
						filterMatchMode="contains">

						<f:selectItem itemLabel="Selecione um fornecedor..."
							itemValue="#{null}" noSelectionOption="true" />

						<f:selectItems value="#{productBean.listSupplier}" var="sup"
							itemLabel="#{sup.name}" itemValue="#{sup.id}" />

					</p:selectOneMenu>
				</div>

				<div class="info-item full-width">
					<h:outputLabel value="Descrição" styleClass="info-label" />
					<p:inputTextarea id="description"
						value="#{productBean.product.description}" rows="4"
						maxlength="500" counter="descriptionCounter"
						counterTemplate="{0} caracteres restantes" autoResize="false"
						placeholder="Digite uma descrição do produto..." />

					<h:outputText id="descriptionCounter" />
				</div>
			</div>

			<!-- Preços e Stock -->
			<h3 class="section-title">
				<i class="pi pi-dollar"></i> Preços e Stock
			</h3>

			<div class="info-grid three-columns">
				<div class="info-item">
					<h:outputLabel value="Preço de Compra (MT)" styleClass="info-label" />
					<p:inputNumber id="purchasePrice"
						value="#{productBean.product.purchasePrice}" symbol="MT "
						symbolPosition="p" decimalPlaces="2" minValue="0"
						placeholder="0,00" />
				</div>

				<div class="info-item">
					<h:outputLabel value="Preço de Venda (MT)" styleClass="info-label" />
					<p:inputNumber id="salePrice"
						value="#{productBean.product.salePrice}" symbol="MT "
						symbolPosition="p" decimalPlaces="2" minValue="0"
						placeholder="0,00" />
				</div>

				<div class="info-item">
					<h:outputLabel value="Stock Atual" styleClass="info-label" />
					<p:inputNumber id="currentStock"
						value="#{productBean.product.currentStock}" minValue="0"
						decimalPlaces="0" useGrouping="false" placeholder="0" />
				</div>

				<div class="info-item">
					<h:outputLabel value="Stock Mínimo" styleClass="info-label" />
					<p:inputNumber id="minimumStock"
						value="#{productBean.product.minimumStock}" minValue="0"
						decimalPlaces="0" useGrouping="false" placeholder="0" />
				</div>
			</div>

			<hr class="form-divider" />

			<!-- Botões -->
			<div class="button-group">
				<p:commandButton value="Cancelar" icon="pi pi-times"
					action="#{dashboardBean.cancelProductInclude}"
					update=":mainForm:mainContent" process="@this"
					styleClass="btn-cancel" />

				<p:commandButton value="Próximo" icon="pi pi-arrow-right"
					iconPos="right"
					actionListener="#{dashboardBean.loadProductConfirm}"
					process="@form" update=":mainForm:mainContent"
					styleClass="btn-next" />
			</div>

		</div>

	</h:form>
</ui:composition>
